<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Koh Har</title>
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdfbf7;
            color: #2d3748;
        }
        h1, h2, h3 {
            font-family: 'Quicksand', sans-serif;
        }
        .cartoon-card {
            background: #ffffff;
            border: 3px solid #2d3748;
            box-shadow: 5px 5px 0px #2d3748;
            transition: all 0.2s ease-in-out;
        }
        .cartoon-card:hover {
            transform: translateY(-3px);
            box-shadow: 8px 8px 0px #2d3748;
        }
        .cartoon-btn {
            background: #ffde59;
            border: 3px solid #2d3748;
            box-shadow: 4px 4px 0px #2d3748;
            transition: all 0.1s ease;
        }
        .cartoon-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #2d3748;
        }
        .cartoon-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #2d3748;
        }
    </style>
</head>
<body class="selection:bg-yellow-300">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-[#ffde59] border-b-4 border-[#2d3748] py-4 px-6 shadow-md">
