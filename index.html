    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            space: {
              bg: '#0b0d19',
              card: 'rgba(255, 255, 255, 0.04)',
              border: 'rgba(255, 255, 255, 0.1)',
              accent: '#3b82f6',
              glow: '#60a5fa',
              cyan: '#06b6d4',

          }
        }

  <style>
    body {
      background-color: #0b0d19;
      color: #f3f4f6;
      overflow-x: hidden;
    }
    
    /* Background Star Canvas Fix */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Glassmorphism card effect */
    .glass-card {
      background: rgba(20, 24, 45, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card:hover {
      border-color: rgba(96, 165, 250, 0.4);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
    }

    /* Floating navigation glow header */
    .glass-header {
      background: rgba(11, 13, 25, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
    }

    /* Glow text effect */
    .glow-text {
      text-shadow: 0 0 15px rgba(96, 165, 250, 0.6);
    }

    /* Cursor animation for dynamic typing */
    .typing-cursor::after {
      content: '|';
      animation: blink 1s infinite;
      color: #60a5fa;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Nebula Background Orbs */
    .nebula-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      opacity: 0.35;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

      0% { transform: translate(0px, 0px) scale
