<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Interaktif | Koh Har</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fef6e4;
            color: #172b4d;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 {
            font-family: 'Quicksand', sans-serif;
        }
        /* Kartun Neo-Brutalism Card Style */
        .cartoon-card {
            background: #ffffff;
            border: 3px solid #172b4d;
            box-shadow: 6px 6px 0px #172b4d;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cartoon-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 10px 10px 0px #172b4d;
        }
        /* Tombol Animasi Sentuh Interaktif */
        .cartoon-btn {
            background: #ff6b6b;
            color: #ffffff;
            border: 3px solid #172b4d;
            box-shadow: 4px 4px 0px #172b4d;
            transition: all 0.1s ease;
        }
        .cartoon-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #172b4d;
            background: #ff5252;
        }
        .cartoon-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #172b4d;
        }
        .cartoon-btn-yellow {
            background: #ffd93d;
            color: #172b4d;
            border: 3px solid #172b4d;
            box-shadow: 4px 4px 0px #172b4d;
            transition: all 0.1s ease;
        }
        .cartoon-btn-yellow:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #172b4d;
            background: #ffca00;
        }
        .cartoon-btn-yellow:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #172b4d;
        }
        /* Animasi Mengambang & Berputar */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s ease-in-out infinite;
        }
    </style>
</head>

                <a href="#skills" class="hover:bg-[#ff6b6b] hover:text-white px-3 py-1 rounded-lg border-2 border-transparent hover:border-[#172b4d] transition">Keahlian</a>
                <a href="#contact" class="hover:bg-[#ff6b6b] hover:text-white px-3 py-1 rounded-lg border-2 border-transparent hover:border-[#172b4d] transition">Kontak</a>
            </nav>
        </div>
    </header>
